<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Target Tabungan — Cloudflare Workers FaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Menghilangkan panah bawaan input number agar tampilan lebih bersih */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-[#fcf9f7] text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

  <!-- Dekorasi Latar Belakang Halus -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden -z-10">
    <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-pink-200/30 blur-3xl"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-rose-100/40 blur-3xl"></div>
  </div>

  <main class="w-full max-w-lg bg-white/95 backdrop-blur-sm border border-pink-100/90 rounded-3xl shadow-[0_20px_50px_-15px_rgba(185,103,130,0.14)] overflow-hidden">
    
    <!-- Header Kartu -->
    <div class="px-6 pt-6 pb-5 bg-gradient-to-br from-[#fff8fa] via-white to-[#fdf4f7] border-b border-pink-100/70">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-[#b96782] bg-pink-50 border border-pink-200/60 px-3 py-1 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-[#b96782] animate-pulse"></span>
          Cloudflare Workers FaaS
        </span>
        <button type="button" id="btnReset"
          class="text-xs font-medium text-slate-400 hover:text-[#b96782] transition cursor-pointer">
          Reset Form
        </button>
      </div>

      <div class="mt-4 flex items-start gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-[#b96782] text-white flex items-center justify-center shrink-0 shadow-sm shadow-pink-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Target Tabungan</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5 leading-relaxed">
            Simulasi estimasi waktu pencapaian dana secara <span class="text-slate-700 font-medium">real-time</span> melalui Edge Computing.
          </p>
        </div>
      </div>
    </div>

    <!-- Form Input -->
    <div class="p-6">
      <form id="formTabungan" class="space-y-4">
        
        <!-- Target Tabungan -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="target" class="text-sm font-semibold text-slate-700">Target Tabungan</label>
            <span id="previewTarget" class="text-xs font-medium text-[#b96782]">Rp 0</span>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-semibold text-slate-400 pointer-events-none">Rp</span>
            <input type="number" id="target" placeholder="10000000" required
              class="w-full pl-11 pr-4 py-2.5 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 font-semibold placeholder:font-normal placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-pink-100 focus:border-[#b96782] transition" />
          </div>
          <!-- Preset Cepat Target -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" data-preset-target="3000000" class="preset-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-pink-50 text-slate-600 hover:text-[#b96782] transition cursor-pointer">Rp 3 Jt</button>
            <button type="button" data-preset-target="5000000" class="preset-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-pink-50 text-slate-600 hover:text-[#b96782] transition cursor-pointer">Rp 5 Jt</button>
            <button type="button" data-preset-target="10000000" class="preset-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-pink-50 text-slate-600 hover:text-[#b96782] transition cursor-pointer">Rp 10 Jt</button>
            <button type="button" data-preset-target="25000000" class="preset-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-pink-50 text-slate-600 hover:text-[#b96782] transition cursor-pointer">Rp 25 Jt</button>
          </div>
        </div>

        <!-- Grid 2 Kolom untuk Saldo Awal & Setoran -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
          <!-- Saldo Awal -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="awal" class="text-sm font-semibold text-slate-700">Saldo Awal</label>
              <span id="previewAwal" class="text-[11px] font-medium text-slate-500">Rp 0</span>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-semibold text-slate-400 pointer-events-none">Rp</span>
              <input type="number" id="awal" placeholder="0" value="0"
                class="w-full pl-11 pr-3.5 py-2.5 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 font-semibold placeholder:font-normal placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-pink-100 focus:border-[#b96782] transition" />
            </div>
          </div>

          <!-- Setoran per Bulan -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="setoran" class="text-sm font-semibold text-slate-700">Setoran / Bulan</label>
              <span id="previewSetoran" class="text-[11px] font-medium text-[#b96782]">Rp 0</span>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-semibold text-slate-400 pointer-events-none">Rp</span>
              <input type="number" id="setoran" placeholder="500000" required
                class="w-full pl-11 pr-3.5 py-2.5 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 font-semibold placeholder:font-normal placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-pink-100 focus:border-[#b96782] transition" />
            </div>
          </div>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" id="btnHitung"
          class="w-full mt-2 bg-gradient-to-r from-[#b96782] to-[#a3526d] hover:from-[#a85873] hover:to-[#8f445d] active:scale-[0.99] text-white font-semibold py-3 rounded-xl shadow-md shadow-pink-200/70 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span id="btnText">Hitung Estimasi via Worker</span>
        </button>
      </form>

      <!-- Box Hasil Perhitungan -->
      <div id="boxHasil" class="hidden mt-6 rounded-2xl bg-gradient-to-b from-pink-50/80 to-rose-50/40 border border-pink-200/70 p-5 space-y-4 transition-all">
        
        <!-- Ringkasan Utama -->
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-[#b96782]">Hasil Kalkulasi Serverless</span>
          <p class="text-base sm:text-lg font-bold text-slate-900 mt-1" id="teksKeterangan"></p>
        </div>

        <!-- Progress Bar Tabungan -->
        <div class="bg-white/80 rounded-xl p-3 border border-pink-100">
          <div class="flex justify-between text-xs font-medium mb-1.5">
            <span class="text-slate-500">Progres Saldo Saat Ini</span>
            <span class="font-bold text-[#b96782]" id="teksPersen">0%</span>
          </div>
          <div class="w-full h-2.5 bg-pink-100 rounded-full overflow-hidden">
            <div id="barProgres" class="h-full bg-gradient-to-r from-[#b96782] to-[#d4829d] rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <!-- Detail 2 Kolom -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white/90 p-3 rounded-xl border border-pink-100">
            <p class="text-[11px] text-slate-500">Sisa Dana Dibutuhkan</p>
            <p class="text-sm font-bold text-slate-900 mt-0.5" id="teksSisa">Rp 0</p>
          </div>
          <div class="bg-white/90 p-3 rounded-xl border border-pink-100">
            <p class="text-[11px] text-slate-500">Perkiraan Tercapai</p>
            <p class="text-sm font-bold text-slate-900 mt-0.5" id="teksTanggal">-</p>
          </div>
        </div>

        <!-- Footer Info Edge Node & Copy URL -->
        <div class="pt-3 border-t border-pink-200/60 flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-1.5 text-slate-600">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Edge Node:</span>
            <span class="font-mono-code font-semibold bg-white text-slate-800 px-2 py-0.5 rounded-md border border-pink-100 shadow-2xs" id="teksEdge">-</span>
          </div>

          <button type="button" id="btnSalin"
            class="inline-flex items-center gap-1 font-medium text-[#b96782] hover:text-[#8f445d] bg-white hover:bg-pink-50 px-2.5 py-1 rounded-lg border border-pink-200/70 transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span id="teksSalin">Salin Link</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("formTabungan");
    const btnHitung = document.getElementById("btnHitung");
    const btnText = document.getElementById("btnText");
    const boxHasil = document.getElementById("boxHasil");
    const inputTarget = document.getElementById("target");
    const inputAwal = document.getElementById("awal");
    const inputSetoran = document.getElementById("setoran");

    let jedaKetik;

    function formatRupiah(angka) {
      const num = Number(angka) || 0;
      return "Rp " + num.toLocaleString("id-ID");
    }

    function updatePreviewInput() {
      document.getElementById("previewTarget").textContent = formatRupiah(inputTarget.value);
      document.getElementById("previewAwal").textContent = formatRupiah(inputAwal.value);
      document.getElementById("previewSetoran").textContent = formatRupiah(inputSetoran.value);
    }

    function hitungPerkiraanBulanTahun(tambahanBulan) {
      if (tambahanBulan <= 0) return "Sudah Tercapai";
      const tgl = new Date();
      tgl.setMonth(tgl.getMonth() + tambahanBulan);
      return new Intl.DateTimeFormat("id-ID", { month: "long", year: "numeric" }).format(tgl);
    }

    async function jalankanPerhitungan() {
      const target = inputTarget.value;
      const awal = inputAwal.value || 0;
      const setoran = inputSetoran.value;

      // Jangan panggil Worker jika target atau setoran masih kosong / <= 0
      if (!target || !setoran || Number(target) <= 0 || Number(setoran) <= 0) {
        boxHasil.classList.add("hidden");
        return;
      }

      // 1. Update otomatis link di address bar browser tanpa reload halaman
      const urlBaru = `?target=${encodeURIComponent(target)}&awal=${encodeURIComponent(awal)}&setoran=${encodeURIComponent(setoran)}`;
      window.history.replaceState(null, "", urlBaru);

      btnText.textContent = "Menghitung otomatis...";
      btnHitung.disabled = true;

      try {
        // 2. Panggil API Cloudflare Worker secara otomatis (tidak diubah)
        const response = await fetch(`/api/hitung${urlBaru}`);
        const data = await response.json();

        if (data.status === "sukses") {
          const sisa = data.hasil_perhitungan.sisa_dana_dibutuhkan;
          const bulan = data.hasil_perhitungan.estimasi_waktu_bulan;
          const persen = Math.min(100, Math.max(0, Math.round((Number(awal) / Number(target)) * 100)));

          document.getElementById("teksKeterangan").textContent = data.hasil_perhitungan.keterangan;
          document.getElementById("teksSisa").textContent = formatRupiah(sisa);
          document.getElementById("teksTanggal").textContent = hitungPerkiraanBulanTahun(bulan);
          document.getElementById("teksEdge").textContent = data.lokasi_eksekusi_edge;
          document.getElementById("teksPersen").textContent = `${persen}%`;
          document.getElementById("barProgres").style.width = `${persen}%`;

          boxHasil.classList.remove("hidden");
        }
      } catch (err) {
        console.error("Gagal memanggil Worker:", err);
      } finally {
        btnText.textContent = "Hitung Estimasi via Worker";
        btnHitung.disabled = false;
      }
    }

    // Event input real-time + preview rupiah
    [inputTarget, inputAwal, inputSetoran].forEach((input) => {
      input.addEventListener("input", () => {
        updatePreviewInput();
        clearTimeout(jedaKetik);
        jedaKetik = setTimeout(jalankanPerhitungan, 500);
      });
    });

    // Tombol preset cepat target tabungan
    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        inputTarget.value = btn.getAttribute("data-preset-target");
        updatePreviewInput();
        clearTimeout(jedaKetik);
        jalankanPerhitungan();
      });
    });

    // Tombol reset form
    document.getElementById("btnReset").addEventListener("click", () => {
      inputTarget.value = "";
      inputAwal.value = "0";
      inputSetoran.value = "";
      updatePreviewInput();
      boxHasil.classList.add("hidden");
      window.history.replaceState(null, "", window.location.pathname);
    });

    // Tombol salin URL hasil
    document.getElementById("btnSalin").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        const teksSalin = document.getElementById("teksSalin");
        teksSalin.textContent = "Tersalin!";
        setTimeout(() => {
          teksSalin.textContent = "Salin Link";
        }, 2000);
      } catch (err) {
        console.error("Gagal menyalin URL:", err);
      }
    });

    // Tetap dukung submit manual
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearTimeout(jedaKetik);
      jalankanPerhitungan();
    });

    // Isi otomatis form jika dibuka lewat tautan berparameter
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has("target") && params.has("setoran")) {
        inputTarget.value = params.get("target");
        inputAwal.value = params.get("awal") || 0;
        inputSetoran.value = params.get("setoran");
        updatePreviewInput();
        jalankanPerhitungan();
      } else {
        updatePreviewInput();
      }
    });
  </script>
</body>
</html>
