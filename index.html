<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Target Tabungan (FaaS Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fffdf9] text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-white border border-pink-100 rounded-2xl shadow-sm p-6">
    <div class="mb-6">
      <span class="text-xs font-semibold uppercase tracking-wider text-[#b96782] bg-pink-50 px-2.5 py-1 rounded-full">
        Cloudflare Workers FaaS
      </span>
      <h1 class="text-2xl font-bold mt-2 text-slate-900">Target Tabungan</h1>
      <p class="text-sm text-slate-500 mt-1">
        Hitung estimasi waktu tercapainya target dana menggunakan fungsi serverless.
      </p>
    </div>

    <!-- Form Input -->
    <form id="formTabungan" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Target Tabungan (Rp)</label>
        <input type="number" id="target" placeholder="Contoh: 10000000" required
          class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-[#b96782]" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Saldo Awal Saat Ini (Rp)</label>
        <input type="number" id="awal" placeholder="Contoh: 1500000" value="0"
          class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-[#b96782]" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Setoran Rutin per Bulan (Rp)</label>
        <input type="number" id="setoran" placeholder="Contoh: 500000" required
          class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-[#b96782]" />
      </div>

      <button type="submit" id="btnHitung"
        class="w-full bg-[#b96782] hover:bg-[#a3556f] text-white font-medium py-2.5 rounded-xl transition cursor-pointer">
        Hitung Estimasi via Worker
      </button>
    </form>

    <!-- Area Hasil dari Cloudflare Worker -->
    <div id="boxHasil" class="hidden mt-6 p-4 rounded-xl bg-pink-50/60 border border-pink-100 text-sm space-y-2">
      <p class="font-semibold text-[#b96782]" id="teksKeterangan"></p>
      <div class="text-xs text-slate-600 space-y-1 pt-2 border-t border-pink-100">
        <p>Sisa Dana Dibutuhkan: <span class="font-semibold" id="teksSisa"></span></p>
        <p>Dieksekusi di Edge Node: <span class="font-mono bg-white px-1.5 py-0.5 rounded border" id="teksEdge"></span></p>
      </div>
    </div>
  </div>

  <script>
    // NANTI GANTI URL INI DENGAN URL CLOUDFLARE WORKER KAMU
    const WORKER_URL = "https://api-target-tabungan.username-kamu.workers.dev";

    const form = document.getElementById("formTabungan");
    const btnHitung = document.getElementById("btnHitung");
    const boxHasil = document.getElementById("boxHasil");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnHitung.textContent = "Memanggil FaaS...";
      btnHitung.disabled = true;

      const target = document.getElementById("target").value;
      const awal = document.getElementById("awal").value || 0;
      const setoran = document.getElementById("setoran").value;

      try {
        // Mengirim HTTP GET Request ke Cloudflare Worker
        const response = await fetch(`${WORKER_URL}/?target=${target}&awal=${awal}&setoran=${setoran}`);
        const data = await response.json();

        if (data.status === "sukses") {
          document.getElementById("teksKeterangan").textContent = data.hasil_perhitungan.keterangan;
          document.getElementById("teksSisa").textContent = "Rp " + data.hasil_perhitungan.sisa_dana_dibutuhkan.toLocaleString("id-ID");
          document.getElementById("teksEdge").textContent = data.lokasi_eksekusi_edge;
          boxHasil.classList.remove("hidden");
        } else {
          alert(data.pesan);
        }
      } catch (err) {
        alert("Gagal terhubung ke Cloudflare Worker. Pastikan URL Worker sudah benar dan sudah di-deploy.");
      } finally {
        btnHitung.textContent = "Hitung Estimasi via Worker";
        btnHitung.disabled = false;
      }
    });
  </script>
</body>
</html>
